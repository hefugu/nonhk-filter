const API='https://bwassrcmnzwzrxvwuiyo.supabase.co/functions/v1/poker-api';const app=document.getElementById('app');let room=new URLSearchParams(location.search).get('room')||'';room=room.toUpperCase();let state=null,busy=false,timer=null,selected=new Set(),prevView={handNo:null,phase:null,pot:null,community:0,turn:null,result:''},toastTimer=null,lastDisplayedActionId=null,actionHideTimer=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const tokenKey=c=>'poker-v2:'+c+':token';const newToken=()=>crypto.randomUUID()+'-'+crypto.randomUUID();
async function req(path,opt={}){const r=await fetch(API+path,opt),d=await r.json().catch(()=>({error:'Server response error'}));if(!r.ok)throw new Error(d.error||'Failed');return d}
function err(m){const e=document.getElementById('err');if(e){e.textContent=m||'';e.style.display=m?'block':'none'}}
function toast(m){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),1800)}
function actionText(a){
  if(!a)return '';
  if(a.type==='allin')return `${a.name}  ALL IN`;
  if(a.type==='raise')return `${a.name}  RAISE TO ${a.to}`;
  if(a.type==='call')return `${a.name}  CALL ${a.paid}`;
  if(a.type==='fold')return `${a.name}  FOLD`;
  if(a.type==='check')return `${a.name}  CHECK`;
  if(a.type==='draw')return `${a.name}  ${a.paid}枚交換`;
  return '';
}
function showActionBanner(a){
  if(!a||a.type==='start'||!a.id||a.id===lastDisplayedActionId)return;
  lastDisplayedActionId=a.id;
  clearTimeout(actionHideTimer);
  document.querySelectorAll('.actionFeed').forEach(x=>x.remove());
  const table=document.querySelector('.table');
  if(!table)return;
  const feed=document.createElement('div');
  feed.className='actionFeed';
  const ev=document.createElement('div');
  ev.className='actionEvent '+a.type;
  const name=document.createElement('span');
  name.className='actionName';
  name.textContent=actionText(a);
  ev.appendChild(name);
  if(a.type==='allin'){
    const sub=document.createElement('span');
    sub.className='actionSub';
    sub.textContent='全チップを投入';
    ev.appendChild(sub);
  }
  feed.appendChild(ev);
  table.appendChild(feed);
  actionHideTimer=setTimeout(()=>{ if(feed.isConnected) feed.remove(); },1400);
}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function niceTarget(n,min,max){if(max<=0)return 0;return clamp(Math.round(n),Math.min(min,max),max)}
function setRaiseTarget(v){const r=document.getElementById('raise'),s=document.getElementById('raiseRange'),o=document.getElementById('raiseValue'),b=document.getElementById('raiseBtn');if(!r||!s||!o)return;const lo=Number(s.min),hi=Number(s.max);v=Math.max(lo,Math.min(hi,Math.round(Number(v)||lo)));r.value=String(v);s.value=String(v);o.textContent=String(v);if(b){const all=v===hi;b.textContent=all?'ALL IN '+v:'レイズ '+v;b.classList.toggle('allinConfirm',all)}}

function saveName(){const n=document.getElementById('name')?.value.trim()||localStorage.getItem('poker-v2:name')||'';localStorage.setItem('poker-v2:name',n);return n}
async function create(gameType,playMode){if(busy)return;busy=true;err('');try{const name=saveName();if(!name)throw new Error('名前を入れて');const token=newToken();const botCount=Number(document.getElementById('bots-'+gameType)?.value||2);const d=await req('/api/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,token,gameType,playMode,botCount})});localStorage.setItem(tokenKey(d.code),token);location.href=location.pathname+'?room='+d.code}catch(e){err(e.message)}finally{busy=false}}
async function join(){if(busy)return;busy=true;err('');try{const name=saveName(),code=document.getElementById('joincode').value.trim().toUpperCase();if(!name)throw new Error('名前を入れて');const token=newToken();const d=await req('/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,code,token})});localStorage.setItem(tokenKey(d.code),token);location.href=location.pathname+'?room='+d.code}catch(e){err(e.message)}finally{busy=false}}
function home(){if(timer)clearInterval(timer);const name=localStorage.getItem('poker-v2:name')||'';app.innerHTML=`<main class="shell"><div class="eyebrow">POKER</div><h1>POKER TABLE</h1><p class="lead">遊ぶルールと対戦方法を選択。</p><div id="err" class="error" style="display:none"></div><div class="namebox"><label>プレイヤー名<input id="name" maxlength="18" value="${esc(name)}" placeholder="Player"></label></div><section class="modes"><article class="mode"><div class="eyebrow">TEXAS HOLD'EM</div><h2>テキサスポーカー</h2><p>2枚の手札と5枚のコミュニティカードで勝負。</p><div class="buttons"><button class="primary" onclick="create('texas','bot')">BOT対戦</button><button class="secondary" onclick="create('texas','online')">オンライン部屋を作る</button></div><div class="botrow"><select id="bots-texas"><option value="1">BOT 1人</option><option value="2" selected>BOT 2人</option><option value="3">BOT 3人</option><option value="4">BOT 4人</option><option value="5">BOT 5人</option></select><span class="drawhelp">BOT対戦時の人数</span></div></article><article class="mode"><div class="eyebrow">FIVE CARD DRAW</div><h2>普通のポーカー</h2><p>5カード・ドロー。SB/BBで開始し、5枚配布→ベット→0〜5枚を1回交換→最終ベット→ショーダウン。</p><div class="buttons"><button class="primary" onclick="create('draw','bot')">BOT対戦</button><button class="secondary" onclick="create('draw','online')">オンライン部屋を作る</button></div><div class="botrow"><select id="bots-draw"><option value="1">BOT 1人</option><option value="2" selected>BOT 2人</option><option value="3">BOT 3人</option><option value="4">BOT 4人</option><option value="5">BOT 5人</option></select><span class="drawhelp">BOT対戦時の人数</span></div></article></section><section class="join"><label class="field">オンライン部屋コード<input id="joincode" maxlength="6" value="${esc(room)}" placeholder="ABC123"></label><div></div><button class="secondary" onclick="join()">参加</button></section><p class="fine">遊び用チップのみ。リアルマネー機能なし。</p></main>`;document.getElementById('joincode').oninput=function(){this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)}}
function card(c,hidden=false,i=null,pickable=false){if(hidden)return '<div class="card back"></div>';const suit={S:'♠',H:'♥',D:'♦',C:'♣'},s=c?.[1],r=c?.[0],rank=r==='T'?'10':(r||''),pick=i!==null&&selected.has(i);return `<div class="card ${(s==='H'||s==='D')?'red':''} ${pick?'pick':''}" ${pickable?`data-card-index="${i}"`:''}>${esc(rank+(suit[s]||''))}</div>`}
function phaseName(){return ({lobby:'待機中',preflop:'プリフロップ',flop:'フロップ',turn:'ターン',river:'リバー',draw_bet1:'交換前ベット',draw_select:'カード交換',draw_bet2:'交換後ベット',showdown:'ショーダウン'})[state.phase]||state.phase}
function render(){
 const me=state.players.find(p=>p.id===state.meId),ai=state.actionInfo||{},myTurn=!!ai.isTurn,host=state.hostPlayerId===state.meId,canStart=host&&['lobby','showdown'].includes(state.phase)&&state.players.filter(p=>p.chips>0).length>=2;
 const call=Number(ai.callAmount??(me?Math.max(0,state.currentBet-me.currentBet):0)),min=Number(ai.minRaiseTo??(state.currentBet+state.minRaise)),max=Number(ai.maxRaiseTo??(me?me.currentBet+me.chips:0)),isDraw=state.gameType==='draw',drawing=isDraw&&state.phase==='draw_select'&&me&&!me.drawDone&&!me.folded;
 const phaseChanged=prevView.phase!==null&&prevView.phase!==state.phase,newHand=prevView.handNo===null||prevView.handNo!==state.handNo,boardNew=state.communityCards.length>prevView.community,potChanged=prevView.pot!==null&&prevView.pot!==state.pot,resultChanged=!!state.lastResult&&state.lastResult.text!==prevView.result;
 const prevPlayers=new Map((window.__prevPlayers||[]).map(p=>[p.id,p]));const winnerIds=new Set((state.lastResult?.winners||[]).map(w=>w.playerId));const allActions=state.recentActions||[];const newestAction=allActions.length?allActions[allActions.length-1]:null;
 const others=state.players.filter(p=>p.id!==state.meId);
 const opponentHtml=others.map(p=>{let holes='';if(p.holeCards?.length)holes=p.holeCards.map(c=>card(c)).join('');else if(p.inHand&&!p.folded)holes=Array(isDraw?5:2).fill(0).map(()=>card('',true)).join('');return `<article class="opponent ${p.seat===state.currentTurnSeat?'turn ':''}${p.folded?'fold ':''}${p.allIn?'allin ':''}${winnerIds.has(p.id)?'winner ':''}"><div class="oppTop"><div class="oppName">${esc(p.name)}${p.isBot?' <span style="color:#77838d;font-size:10px">BOT</span>':''}</div>${p.allIn?'<span class="allinTiny">ALL IN</span>':p.seat===state.currentTurnSeat?'<span class="turnTag">行動中</span>':p.seat===state.dealerSeat?'<span class="dealer">D</span>':''}</div><div class="oppStack">${p.chips} <span style="font-size:10px;color:#7f8a95">chips</span></div>${p.currentBet?`<div class="oppBet">ベット ${p.currentBet} / 投入済み ${p.handBet}</div>`:p.handBet?`<div class="oppBet">投入済み ${p.handBet}</div>`:''}<div class="oppCards">${holes}</div></article>`}).join('');
 let boardHtml='';
 if(!isDraw){
   const labels=['FLOP','FLOP','FLOP','TURN','RIVER'];
   for(let i=0;i<5;i++){const c=state.communityCards[i];boardHtml+=`<div class="boardSlot ${c?'':'empty'}"><div class="slotLabel">${labels[i]}</div>${c?card(c):'<div class="card"></div>'}</div>`}
 }else{
   boardHtml=`<div style="grid-column:1/-1;color:#d8f4e4;font-weight:900;padding:22px 0">${state.phase==='draw_select'?'カード交換フェーズ':'5カード・ドロー'}</div>`;
 }
 const myCards=me?.holeCards?.length?me.holeCards.map((c,i)=>card(c,false,i,drawing)).join(''):Array(isDraw?5:2).fill(0).map(()=>card('',true)).join('');
 let control='';
 if(canStart){
   control=`<div><div class="turnCallout">開始できます</div><div class="actionSummary"><span class="summaryItem">プレイヤー <b>${state.players.filter(p=>p.chips>0).length}人</b></span><span class="summaryItem">SB / BB <b>${state.smallBlind} / ${state.bigBlind}</b></span></div><button class="raiseConfirm" style="margin-top:12px" data-act="start_hand">ハンド開始</button></div>`;
 }else if(drawing){
   control=`<div class="drawPanel2"><div class="turnCallout">カードを交換</div><div class="drawHelp2">交換したいカードをタップ。0〜5枚選べます。</div><div class="selectedCount">${selected.size}枚選択中</div><button class="drawConfirm" id="drawBtn">${selected.size===0?'交換せず続行':selected.size+'枚を交換'}</button></div>`;
 }else if(myTurn){
   const canRaise=!!ai.canRaise,shortOnly=!!ai.shortAllInOnly,base=canRaise?(shortOnly?max:Math.min(max,min)):0;
   const half=niceTarget(state.currentBet+Math.max(state.bigBlind,Math.ceil(state.pot*.5)),min,max);
   const potTarget=niceTarget(state.currentBet+Math.max(state.bigBlind,state.pot),min,max);
   const step=Math.max(1,state.bigBlind||20);
   const main=`<div class="turnCallout">あなたの番</div><div class="actionSummary"><span class="summaryItem">相手のベット <b>${state.currentBet}</b></span><span class="summaryItem">コール <b>${call}</b></span><span class="summaryItem">手持ち <b>${me.chips}</b></span><span class="summaryItem">POT <b>${state.pot}</b></span></div><div class="mainActions"><button class="btnFold" data-act="fold">フォールド</button>${ai.canCheck?'<button class="btnCheck" data-act="check">チェック</button>':'<button class="btnCheck" disabled>チェック不可</button>'}${ai.canCall?`<button class="btnCall" data-act="call">コール ${Math.min(call,me.chips)}</button>`:'<button class="btnCall" disabled>コール不要</button>'}</div>`;
   const raise=canRaise?`<div class="raiseBox2"><div class="raiseHeader2"><div><div class="small">レイズ後の合計ベット額</div><div class="big"><span id="raiseValue">${base}</span> chips</div></div><div class="small">${shortOnly?'オールインのみ可能':`最小 ${min} / 最大 ${max}`}</div></div><div class="presetGrid">${shortOnly?'':`<button type="button" data-raise="${min}">MIN</button><button type="button" data-raise="${half}">½ POT</button><button type="button" data-raise="${potTarget}">POT</button>`}<button type="button" data-raise="${max}">ALL IN</button></div><div class="raiseAdjust">${shortOnly?'<button disabled>−BB</button>':`<button type="button" id="minusBB">−BB</button>`}<input id="raiseRange" type="range" min="${shortOnly?max:min}" max="${max}" step="1" value="${base}" ${shortOnly?'disabled':''}>${shortOnly?'<button disabled>+BB</button>':`<button type="button" id="plusBB">+BB</button>`}</div><input id="raise" type="number" min="${shortOnly?max:min}" max="${max}" value="${base}" hidden><button class="raiseConfirm ${base===max?'allinConfirm':''}" id="raiseBtn">${base===max?'ALL IN '+base:'レイズ '+base}</button></div>`:`<div class="hintbox" style="margin-top:10px">${ai.raiseReopened===false?'このアクションでは再レイズできません':'現在レイズできません'}</div>`;
   control=main+raise;
 }else{
   const who=state.players.find(p=>p.seat===state.currentTurnSeat);
   control=`<div class="waitingBox">${state.phase==='lobby'?(host?'2人以上で開始できます':'ホストの開始待ち'):state.phase==='showdown'?'ショーダウン':state.phase==='draw_select'?'ほかのプレイヤーが交換中':who?`${esc(who.name)} の番です`:'進行中'}</div>`;
 }
 const online=state.playMode==='online';
 app.innerHTML=`<main class="shell"><header class="gameHeader"><div class="gameTitle"><h2>${state.gameType==='texas'?'テキサスホールデム':'5カード・ドロー'}</h2><span class="roundPill">${phaseName()}</span>${online?`<button id="copy" class="roomCode">ROOM ${esc(state.code)}</button>`:''}</div><div class="stats"><span class="pill">HAND ${state.handNo}</span><span class="pill">POT ${state.pot}</span></div></header><div id="err" class="error" style="display:none;max-width:1100px;margin:8px auto"></div><section class="pokerStage">${potChanged?'<span class="chipfly"></span>':''}<div class="opponents">${opponentHtml}</div><div class="boardArea"><div class="boardLabel">${isDraw?'GAME':'COMMUNITY CARDS'}</div><div class="boardSlots ${boardNew?'board-new':''}">${boardHtml}</div><div class="potBox">POT <strong>${state.pot}</strong></div>${state.lastResult?`<div class="resultBox ${resultChanged?'winflash':''}">${esc(state.lastResult.text)}</div>`:''}</div></section><section class="playerDock"><div class="youRow"><div class="yourHand"><div class="yourHandTitle"><strong>あなたの手札</strong><span class="yourStack">${me?me.chips:0} chips</span></div><div class="yourCards ${newHand?'my-new':''}">${myCards}</div>${me?.handBet?`<div class="oppBet" style="margin-top:7px">このハンド投入済み ${me.handBet}</div>`:''}</div><div>${control}</div></div></section><p class="fine"><a class="home" href="${location.pathname}">トップへ</a> / 遊び用チップのみ</p></main>`;
 if(online)document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(location.origin+location.pathname+'?room='+state.code).then(()=>toast('招待リンクをコピーしました'));
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act({type:b.dataset.act}));
 document.querySelectorAll('[data-card-index]').forEach(c=>c.onclick=()=>{const i=Number(c.dataset.cardIndex);if(selected.has(i))selected.delete(i);else if(selected.size<5)selected.add(i);render()});
 const db=document.getElementById('drawBtn');if(db)db.onclick=()=>act({type:'draw',discardIndexes:[...selected]});
 document.querySelectorAll('[data-raise]').forEach(b=>b.onclick=()=>setRaiseTarget(Number(b.dataset.raise)));
 const slider=document.getElementById('raiseRange');if(slider)slider.oninput=()=>setRaiseTarget(slider.value);
 const minus=document.getElementById('minusBB');if(minus)minus.onclick=()=>setRaiseTarget(Number(document.getElementById('raise').value)-Math.max(1,state.bigBlind||20));
 const plus=document.getElementById('plusBB');if(plus)plus.onclick=()=>setRaiseTarget(Number(document.getElementById('raise').value)+Math.max(1,state.bigBlind||20));
 const rb=document.getElementById('raiseBtn');if(rb)rb.onclick=()=>{const v=Number(document.getElementById('raise').value);const legalMin=ai.shortAllInOnly?max:min;if(v<legalMin||v>max)return err(`レイズ額は ${legalMin} ～ ${max}`);act({type:'raise',amount:v})};
 window.__prevPlayers=state.players.map(p=>({id:p.id,handBet:p.handBet}));
 prevView={handNo:state.handNo,phase:state.phase,pot:state.pot,community:state.communityCards.length,turn:state.currentTurnSeat,result:state.lastResult?.text||''};showActionBanner(newestAction);
}
async function load(){const t=localStorage.getItem(tokenKey(room));if(!t){home();return}try{state=await req('/api/room/'+room,{headers:{'x-player-token':t},cache:'no-store'});render();err('')}catch(e){if(e.message==='Not joined'){localStorage.removeItem(tokenKey(room));home()}else err(e.message)}}
async function act(a){if(busy)return;busy=true;try{const t=localStorage.getItem(tokenKey(room));state=await req('/api/room/'+room+'/action',{method:'POST',headers:{'content-type':'application/json','x-player-token':t},body:JSON.stringify(a)});selected.clear();render()}catch(e){err(e.message);await load()}finally{busy=false}}
if(room&&localStorage.getItem(tokenKey(room))){app.innerHTML='<div class="loading">接続中...</div>';load();timer=setInterval(()=>{if(!busy)load()},1500)}else home();
</script></body></html>
