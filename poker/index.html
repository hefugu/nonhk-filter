<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Poker Table</title>
<style>
:root{--bg:#080a0c;--panel:#11151a;--line:#29313a;--text:#f3f5f7;--muted:#88939e;--green:#5cff9d;--red:#ff6170;--gold:#e4c16f;--felt:#07583a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0c;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;padding:clamp(18px,4vw,56px);background:radial-gradient(circle at 82% 8%,#184d3433,transparent 30%),linear-gradient(145deg,#0d1114,#050607 75%)}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:900;color:var(--green)}h1{font-size:clamp(48px,11vw,110px);line-height:.86;letter-spacing:-.065em;margin:12px 0 18px}.lead{color:var(--muted);margin:0 0 34px}.namebox{max-width:560px;margin:0 0 24px}.namebox label,.field{display:grid;gap:8px;color:var(--muted);font-size:12px;font-weight:800}input,select{width:100%;background:#090c10;border:1px solid var(--line);color:#fff;padding:14px 15px;outline:none}input:focus,select:focus{border-color:#3ddf86}.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1050px}.mode{border:1px solid var(--line);background:var(--panel);padding:26px}.mode h2{font-size:28px;margin:8px 0}.mode p{color:var(--muted);min-height:48px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary,.danger{border:0;padding:13px 16px;font-weight:900}.primary{background:var(--green);color:#031309}.secondary{background:#252d35;color:#fff}.danger{background:var(--red);color:#1b0306}.botrow{display:grid;grid-template-columns:120px 1fr;gap:8px;margin-top:12px}.join{max-width:1050px;margin-top:16px;border:1px solid var(--line);background:#0d1115;padding:20px;display:grid;grid-template-columns:1fr 180px auto;gap:10px;align-items:end}.error{max-width:1050px;margin:14px 0;padding:12px 14px;background:#35131a;border:1px solid #74303b;color:#ffc2c8}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;max-width:1200px;margin:0 auto 18px}.top h2{margin:5px 0 0}.stats{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#151b21;padding:7px 10px;font-size:12px}.codebtn{border:0;background:none;color:#fff;padding:0;font-size:24px;font-weight:900;letter-spacing:.18em}.tableWrap{max-width:1200px;margin:auto}.table{min-height:520px;border:9px solid #2b1e16;border-radius:42%;padding:30px;background:radial-gradient(circle,#0b724b,#084b33 68%,#05331f);box-shadow:inset 0 0 60px #041e14,0 28px 70px #000;position:relative}.center{text-align:center;min-height:155px}.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.card{width:56px;height:80px;background:#f7f5ef;color:#151515;border-radius:7px;border:1px solid #bbb;display:grid;place-items:center;font-size:19px;font-weight:900;box-shadow:0 4px 10px #0004;user-select:none}.card.red{color:#d51d34}.card.back{background:repeating-linear-gradient(45deg,#131a22,#131a22 6px,#2d3741 6px,#2d3741 12px);border-color:#687582}.card.pick{outline:4px solid var(--gold);transform:translateY(-8px)}.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.seat{min-height:136px;background:#0b1014e8;border:1px solid #26313b;padding:11px}.seat.turn{outline:2px solid var(--green);box-shadow:0 0 24px #5cff9d44}.seat.fold{opacity:.48}.seat h3{margin:5px 0;font-size:14px}.meta{display:flex;justify-content:space-between;color:#7f8a95;font-size:10px}.dealer{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;font-weight:900}.chips{font-size:21px;font-weight:900}.chips small{font-size:10px;color:#7f8a95}.mini{display:flex;gap:4px;margin-top:7px}.mini .card{width:30px;height:43px;font-size:10px}.status{font-size:10px;color:#7e8994;margin-top:7px}.pot{display:inline-block;margin-top:13px;background:#061e14bb;border:1px solid #2ea46f;border-radius:99px;padding:7px 13px}.result{max-width:720px;margin:12px auto 0;padding:9px 12px;border:1px solid var(--gold);background:#11160fdd;color:#ffe5a4}.dock{max-width:1200px;margin:16px auto 0;border:1px solid var(--line);background:#0d1115;padding:16px;display:grid;grid-template-columns:260px 1fr;gap:14px}.mycards .cards{justify-content:flex-start;margin-top:8px}.actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}.raise{display:flex;gap:6px}.raise input{width:150px}.drawhelp{color:var(--muted);font-size:12px}.fine{max-width:1200px;margin:14px auto;color:#59636e;font-size:12px}.home{color:var(--green);text-decoration:none}.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
@media(max-width:850px){.modes{grid-template-columns:1fr}.join{grid-template-columns:1fr}.players{grid-template-columns:repeat(2,minmax(0,1fr))}.table{border-radius:28px;min-height:0}.dock{grid-template-columns:1fr}.actions{justify-content:flex-start}.top{align-items:flex-start;flex-direction:column}.mode p{min-height:0}}@media(max-width:480px){.shell{padding:16px}.table{padding:16px 10px;border-width:6px}.card{width:47px;height:67px}.seat{padding:8px}.botrow{grid-template-columns:90px 1fr}.dock{padding:12px}}

.actionPanel{width:min(100%,760px);margin-left:auto;display:grid;gap:12px}.actionHeadline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.yourturn{font-size:18px;font-weight:1000;color:var(--green);text-shadow:0 0 18px #5cff9d55}.betinfo{display:flex;gap:8px;flex-wrap:wrap}.betinfo .pill strong{color:#fff}.raisePanel{width:100%;border:1px solid #2c3640;background:#0a0e12;padding:12px;display:grid;gap:10px}.raiseTop{display:flex;justify-content:space-between;gap:12px;align-items:end}.raiseAmount{font-size:24px;font-weight:1000}.raiseCaption{font-size:11px;color:var(--muted)}.raiseSlider{width:100%;accent-color:#5cff9d;padding:0}.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.quick button{padding:10px 6px;border:1px solid #34404a;background:#192129;color:#fff;font-weight:900}.quick button:hover{border-color:#5cff9d}.quick button:disabled,.actions button:disabled{opacity:.35;cursor:not-allowed}.hintbox{font-size:12px;color:#aeb8c2;background:#0a0d10;border-left:3px solid #5cff9d;padding:9px 11px}.phaseBanner{font-size:12px;font-weight:1000;letter-spacing:.08em;color:#d7ffe6}.seat.turn{animation:turnPulse 1.15s ease-in-out infinite}.seat.betmove{animation:chipIn .55s ease-out}.board-new .card{animation:dealCard .52s cubic-bezier(.2,.8,.2,1) both}.my-new .card{animation:dealCard .48s cubic-bezier(.2,.8,.2,1) both}.my-new .card:nth-child(2),.board-new .card:nth-child(2){animation-delay:.07s}.board-new .card:nth-child(3){animation-delay:.14s}.board-new .card:nth-child(4){animation-delay:.21s}.board-new .card:nth-child(5){animation-delay:.28s}.pot.bump{animation:potBump .5s ease}.result.winflash{animation:winnerGlow 1.2s ease-in-out 2}.phaseflash{animation:phaseFlash .65s ease}.card[data-card-index]{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,outline-color .16s ease}.card[data-card-index]:active{transform:translateY(-4px) scale(.97)}.card.pick{box-shadow:0 0 0 3px #e4c16f55,0 10px 20px #0008}.selectedCount{font-weight:900;color:var(--gold)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;background:#10161c;border:1px solid #34404a;color:#fff;padding:11px 16px;box-shadow:0 10px 35px #0009;animation:toastIn .25s ease}.chipfly{position:absolute;inset:auto 50% 44% auto;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#f6df7b,#a87916);box-shadow:0 0 0 3px #3a2b0b,0 5px 12px #0008;animation:chipFly .55s ease-out forwards;pointer-events:none}
@keyframes turnPulse{0%,100%{box-shadow:0 0 12px #5cff9d33;transform:translateY(0)}50%{box-shadow:0 0 34px #5cff9d88;transform:translateY(-2px)}}@keyframes chipIn{0%{transform:scale(.96);background:#342a13}60%{transform:scale(1.02);background:#18231c}100%{transform:scale(1)}}@keyframes dealCard{0%{opacity:0;transform:translateY(-28px) rotate(-5deg) scale(.75)}100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}}@keyframes potBump{0%{transform:scale(1)}50%{transform:scale(1.18);box-shadow:0 0 22px #e4c16f66}100%{transform:scale(1)}}@keyframes winnerGlow{0%,100%{box-shadow:0 0 0 #e4c16f00}50%{box-shadow:0 0 35px #e4c16f88}}@keyframes phaseFlash{0%{opacity:.2;transform:translateY(-5px)}100%{opacity:1;transform:none}}@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}@keyframes chipFly{0%{opacity:0;transform:translate(80px,60px) scale(.5)}40%{opacity:1}100%{opacity:0;transform:translate(0,0) scale(1.1)}}
@media(max-width:700px){.quick{grid-template-columns:repeat(3,1fr)}.actionPanel{margin:0}.raiseTop{align-items:start;flex-direction:column}.actions{width:100%}.actions>.danger,.actions>.secondary,.actions>.primary{flex:1 1 30%}.raisePanel{padding:10px}}

</style></head><body><div id="app"></div><script>
const API='https://bwassrcmnzwzrxvwuiyo.supabase.co/functions/v1/poker-api';const app=document.getElementById('app');let room=new URLSearchParams(location.search).get('room')||'';room=room.toUpperCase();let state=null,busy=false,timer=null,selected=new Set(),prevView={handNo:null,phase:null,pot:null,community:0,turn:null,result:''},toastTimer=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const tokenKey=c=>'poker-v2:'+c+':token';const newToken=()=>crypto.randomUUID()+'-'+crypto.randomUUID();
async function req(path,opt={}){const r=await fetch(API+path,opt),d=await r.json().catch(()=>({error:'Server response error'}));if(!r.ok)throw new Error(d.error||'Failed');return d}
function err(m){const e=document.getElementById('err');if(e){e.textContent=m||'';e.style.display=m?'block':'none'}}
function toast(m){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),1800)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function niceTarget(n,min,max){if(max<=0)return 0;return clamp(Math.round(n),Math.min(min,max),max)}
function setRaiseTarget(v){const r=document.getElementById('raise'),s=document.getElementById('raiseRange'),o=document.getElementById('raiseValue');if(!r||!s||!o)return;v=Number(v);r.value=String(v);s.value=String(v);o.textContent=String(v)}

function saveName(){const n=document.getElementById('name')?.value.trim()||localStorage.getItem('poker-v2:name')||'';localStorage.setItem('poker-v2:name',n);return n}
async function create(gameType,playMode){if(busy)return;busy=true;err('');try{const name=saveName();if(!name)throw new Error('名前を入れて');const token=newToken();const botCount=Number(document.getElementById('bots-'+gameType)?.value||2);const d=await req('/api/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,token,gameType,playMode,botCount})});localStorage.setItem(tokenKey(d.code),token);location.href=location.pathname+'?room='+d.code}catch(e){err(e.message)}finally{busy=false}}
async function join(){if(busy)return;busy=true;err('');try{const name=saveName(),code=document.getElementById('joincode').value.trim().toUpperCase();if(!name)throw new Error('名前を入れて');const token=newToken();const d=await req('/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,code,token})});localStorage.setItem(tokenKey(d.code),token);location.href=location.pathname+'?room='+d.code}catch(e){err(e.message)}finally{busy=false}}
function home(){if(timer)clearInterval(timer);const name=localStorage.getItem('poker-v2:name')||'';app.innerHTML=`<main class="shell"><div class="eyebrow">POKER</div><h1>POKER TABLE</h1><p class="lead">遊ぶルールと対戦方法を選択。</p><div id="err" class="error" style="display:none"></div><div class="namebox"><label>プレイヤー名<input id="name" maxlength="18" value="${esc(name)}" placeholder="Player"></label></div><section class="modes"><article class="mode"><div class="eyebrow">TEXAS HOLD'EM</div><h2>テキサスポーカー</h2><p>2枚の手札と5枚のコミュニティカードで勝負。</p><div class="buttons"><button class="primary" onclick="create('texas','bot')">BOT対戦</button><button class="secondary" onclick="create('texas','online')">オンライン部屋を作る</button></div><div class="botrow"><select id="bots-texas"><option value="1">BOT 1人</option><option value="2" selected>BOT 2人</option><option value="3">BOT 3人</option><option value="4">BOT 4人</option><option value="5">BOT 5人</option></select><span class="drawhelp">BOT対戦時の人数</span></div></article><article class="mode"><div class="eyebrow">FIVE CARD DRAW</div><h2>普通のポーカー</h2><p>5カード・ドロー。SB/BBで開始し、5枚配布→ベット→0〜5枚を1回交換→最終ベット→ショーダウン。</p><div class="buttons"><button class="primary" onclick="create('draw','bot')">BOT対戦</button><button class="secondary" onclick="create('draw','online')">オンライン部屋を作る</button></div><div class="botrow"><select id="bots-draw"><option value="1">BOT 1人</option><option value="2" selected>BOT 2人</option><option value="3">BOT 3人</option><option value="4">BOT 4人</option><option value="5">BOT 5人</option></select><span class="drawhelp">BOT対戦時の人数</span></div></article></section><section class="join"><label class="field">オンライン部屋コード<input id="joincode" maxlength="6" value="${esc(room)}" placeholder="ABC123"></label><div></div><button class="secondary" onclick="join()">参加</button></section><p class="fine">遊び用チップのみ。リアルマネー機能なし。</p></main>`;document.getElementById('joincode').oninput=function(){this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)}}
function card(c,hidden=false,i=null,pickable=false){if(hidden)return '<div class="card back"></div>';const suit={S:'♠',H:'♥',D:'♦',C:'♣'},s=c?.[1],r=c?.[0],rank=r==='T'?'10':(r||''),pick=i!==null&&selected.has(i);return `<div class="card ${(s==='H'||s==='D')?'red':''} ${pick?'pick':''}" ${pickable?`data-card-index="${i}"`:''}>${esc(rank+(suit[s]||''))}</div>`}
function phaseName(){return ({lobby:'待機中',preflop:'プリフロップ',flop:'フロップ',turn:'ターン',river:'リバー',draw_bet1:'交換前ベット',draw_select:'カード交換',draw_bet2:'交換後ベット',showdown:'ショーダウン'})[state.phase]||state.phase}
function render(){
 const me=state.players.find(p=>p.id===state.meId),ai=state.actionInfo||{},myTurn=!!ai.isTurn,host=state.hostPlayerId===state.meId,canStart=host&&['lobby','showdown'].includes(state.phase)&&state.players.filter(p=>p.chips>0).length>=2;
 const call=Number(ai.callAmount??(me?Math.max(0,state.currentBet-me.currentBet):0)),min=Number(ai.minRaiseTo??(state.currentBet+state.minRaise)),max=Number(ai.maxRaiseTo??(me?me.currentBet+me.chips:0)),isDraw=state.gameType==='draw',drawing=isDraw&&state.phase==='draw_select'&&me&&!me.drawDone&&!me.folded;
 const phaseChanged=prevView.phase!==null&&prevView.phase!==state.phase,newHand=prevView.handNo===null||prevView.handNo!==state.handNo,boardNew=state.communityCards.length>prevView.community,potChanged=prevView.pot!==null&&prevView.pot!==state.pot,resultChanged=!!state.lastResult&&state.lastResult.text!==prevView.result;
 const prevPlayers=new Map((window.__prevPlayers||[]).map(p=>[p.id,p]));let board='';
 if(!isDraw){for(let i=0;i<5;i++)board+=state.communityCards[i]?card(state.communityCards[i]):'<div class="card" style="opacity:.13"></div>'}
 else board=`<div class="eyebrow">FIVE CARD DRAW</div><div style="margin-top:10px;color:#b8c0c7">${state.phase==='draw_select'?'交換したいカードを選ぶ':'5枚の手札で勝負'}</div>`;
 const seats=state.players.map(p=>{let holes='';if(p.holeCards?.length)holes=p.holeCards.map(c=>card(c)).join('');else if(p.inHand&&!p.folded)holes=Array(isDraw?5:2).fill(0).map(()=>card('',true)).join('');const old=prevPlayers.get(p.id),betmove=old&&old.handBet!==p.handBet;return `<article class="seat ${p.seat===state.currentTurnSeat?'turn ':''}${p.folded?'fold ':''}${betmove?'betmove':''}"><div class="meta"><span>SEAT ${p.seat+1}${p.isBot?' / BOT':''}</span>${p.seat===state.dealerSeat?'<b class="dealer">D</b>':''}</div><h3>${esc(p.name)}${p.id===state.meId?' / YOU':''}</h3><div class="chips">${p.chips} <small>chips</small></div>${p.currentBet?`<span class="pill">このラウンド ${p.currentBet}</span>`:''}<div class="mini">${holes}</div><div class="status">${p.folded?'FOLD':p.allIn?'ALL IN':p.seat===state.currentTurnSeat?'← 行動中':p.drawDone&&state.phase==='draw_select'?'交換済み':p.inHand?'参加中':'待機'}</div></article>`}).join('');
 const myCards=me?.holeCards?.length?me.holeCards.map((c,i)=>card(c,false,i,drawing)).join(''):Array(isDraw?5:2).fill(0).map(()=>card('',true)).join('');
 let actions='';
 if(canStart) actions='<div class="actionPanel"><div class="actionHeadline"><span class="yourturn">ハンドを開始できます</span></div><button class="primary" data-act="start_hand">ハンド開始</button></div>';
 else if(drawing) actions=`<div class="actionPanel"><div class="actionHeadline"><span class="yourturn">カード交換</span><span class="selectedCount">${selected.size}枚選択</span></div><div class="hintbox">交換したいカードをタップ。0枚ならそのまま保持、最大5枚まで交換できます。</div><button class="primary" id="drawBtn">${selected.size===0?'交換せず続行':selected.size+'枚を交換'}</button></div>`;
 else if(myTurn){
   const canRaise=!!ai.canRaise,shortOnly=!!ai.shortAllInOnly,defaultTarget=canRaise?(shortOnly?max:Math.min(max,min)):0;
   const half=niceTarget(state.currentBet+Math.max(state.bigBlind,Math.ceil(state.pot*.5)),min,max),potTarget=niceTarget(state.currentBet+Math.max(state.bigBlind,state.pot),min,max),plusBB=niceTarget(state.currentBet+state.bigBlind,min,max);
   const raiseBox=canRaise?`<div class="raisePanel"><div class="raiseTop"><div><div class="raiseCaption">レイズ後の合計ベット額</div><div class="raiseAmount"><span id="raiseValue">${defaultTarget}</span> chips</div></div><div class="raiseCaption">${shortOnly?'残りチップが最小レイズ未満なので、オールインのみ可能':`最小 ${min} / 最大 ${max}`}</div></div><input id="raiseRange" class="raiseSlider" type="range" min="${shortOnly?max:min}" max="${max}" step="1" value="${defaultTarget}" ${shortOnly?'disabled':''}><input id="raise" type="number" min="${shortOnly?max:min}" max="${max}" value="${defaultTarget}" style="display:none"><div class="quick"><button type="button" data-raise="${min}" ${shortOnly?'disabled':''}>MIN</button><button type="button" data-raise="${plusBB}" ${shortOnly?'disabled':''}>+BB</button><button type="button" data-raise="${half}" ${shortOnly?'disabled':''}>½ POT</button><button type="button" data-raise="${potTarget}" ${shortOnly?'disabled':''}>POT</button><button type="button" data-raise="${max}">ALL IN</button></div><button class="primary" id="raiseBtn">${shortOnly?'ALL IN':'この額でレイズ'}</button></div>`:`<div class="hintbox">${ai.raiseReopened===false?'ショートオールインのため、今回は再レイズできません':'手持ちチップ不足でレイズできません'}</div>`;
   actions=`<div class="actionPanel"><div class="actionHeadline"><span class="yourturn">あなたの番</span><span class="phaseBanner">${phaseName()}</span></div><div class="betinfo"><span class="pill">現在のベット <strong>${state.currentBet}</strong></span><span class="pill">あなたは <strong>${me.currentBet}</strong></span><span class="pill">コール額 <strong>${call}</strong></span><span class="pill">ポット <strong>${state.pot}</strong></span></div><div class="actions"><button class="danger" data-act="fold">フォールド</button>${ai.canCheck?'<button class="secondary" data-act="check">チェック</button>':''}${ai.canCall?`<button class="secondary" data-act="call">コール ${Math.min(call,me.chips)}</button>`:''}</div>${raiseBox}</div>`;
 } else actions=`<div class="actionPanel"><div class="actionHeadline"><span class="waiting">${state.phase==='lobby'?(host?'2人以上で開始できます':'ホストの開始待ち'):state.phase==='showdown'?'結果表示中':state.phase==='draw_select'?'ほかのプレイヤーの交換待ち':state.currentTurnSeat!==null?'ほかのプレイヤーの番':'進行中'}</span><span class="phaseBanner ${phaseChanged?'phaseflash':''}">${phaseName()}</span></div></div>`;
 const online=state.playMode==='online';
 app.innerHTML=`<main class="shell"><header class="top"><div><div class="eyebrow">${state.gameType==='texas'?"TEXAS HOLD'EM":"FIVE CARD DRAW"} / ${state.playMode==='bot'?'BOT MATCH':'ONLINE'}</div><h2>${state.gameType==='texas'?'テキサスポーカー':'5カード・ドロー'}</h2>${online?`<button id="copy" class="codebtn">${esc(state.code)}</button>`:''}</div><div class="stats"><span class="pill ${phaseChanged?'phaseflash':''}">${phaseName()}</span><span class="pill">HAND ${state.handNo}</span><span class="pill">POT ${state.pot}</span></div></header><div id="err" class="error" style="display:none"></div><section class="tableWrap"><div class="table">${potChanged?'<span class="chipfly"></span>':''}<div class="center"><div class="cards ${boardNew?'board-new':''}">${board}</div><div class="pot ${potChanged?'bump':''}">POT <b>${state.pot}</b></div>${state.lastResult?`<div class="result ${resultChanged?'winflash':''}">${esc(state.lastResult.text)}</div>`:''}</div><div class="players">${seats}</div></div></section><section class="dock"><div class="mycards"><div class="eyebrow">YOUR HAND</div><div class="cards ${newHand?'my-new':''}">${myCards}</div></div><div class="actions">${actions}</div></section><p class="fine"><a class="home" href="${location.pathname}">トップへ</a> / 遊び用チップのみ</p></main>`;
 if(online)document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(location.origin+location.pathname+'?room='+state.code).then(()=>toast('招待リンクをコピーしました'));
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act({type:b.dataset.act}));
 document.querySelectorAll('[data-card-index]').forEach(c=>c.onclick=()=>{const i=Number(c.dataset.cardIndex);if(selected.has(i))selected.delete(i);else if(selected.size<5)selected.add(i);render()});
 const db=document.getElementById('drawBtn');if(db)db.onclick=()=>act({type:'draw',discardIndexes:[...selected]});
 document.querySelectorAll('[data-raise]').forEach(b=>b.onclick=()=>setRaiseTarget(Number(b.dataset.raise)));
 const slider=document.getElementById('raiseRange');if(slider)slider.oninput=()=>setRaiseTarget(slider.value);
 const rb=document.getElementById('raiseBtn');if(rb)rb.onclick=()=>{const v=Number(document.getElementById('raise').value);const legalMin=ai.shortAllInOnly?max:min;if(v<legalMin||v>max)return err(`レイズ額は ${legalMin} ～ ${max}`);act({type:'raise',amount:v})};
 window.__prevPlayers=state.players.map(p=>({id:p.id,handBet:p.handBet}));
 prevView={handNo:state.handNo,phase:state.phase,pot:state.pot,community:state.communityCards.length,turn:state.currentTurnSeat,result:state.lastResult?.text||''};
}
async function load(){const t=localStorage.getItem(tokenKey(room));if(!t){home();return}try{state=await req('/api/room/'+room,{headers:{'x-player-token':t},cache:'no-store'});render();err('')}catch(e){if(e.message==='Not joined'){localStorage.removeItem(tokenKey(room));home()}else err(e.message)}}
async function act(a){if(busy)return;busy=true;try{const t=localStorage.getItem(tokenKey(room));state=await req('/api/room/'+room+'/action',{method:'POST',headers:{'content-type':'application/json','x-player-token':t},body:JSON.stringify(a)});selected.clear();render()}catch(e){err(e.message);await load()}finally{busy=false}}
if(room&&localStorage.getItem(tokenKey(room))){app.innerHTML='<div class="loading">接続中...</div>';load();timer=setInterval(()=>{if(!busy)load()},1500)}else home();
</script></body></html>
