 const heroCards=me?.folded?'':me?.holeCards?.length?me.holeCards.map((c,i)=>card(c,false,i,drawing,newHand?'dealFromDeck':'',newHand?dealIndex(me.seat,i)*65:0)).join(''):Array(isDraw?5:2).fill(0).map((_,i)=>card('',true,null,false,newHand?'dealFromDeck':'',newHand?dealIndex(me?.seat??0,i)*65:0)).join('');
 const heroRole=me?roleHtml(me):'';
 const heroBet=me?.currentBet>0&&!me?.folded?`<div class="heroBet"><div class="tableBet" style="position:relative;left:auto;top:auto;transform:none"><span class="chipStack"><i class="chipCoin"></i><i class="chipCoin"></i><i class="chipCoin"></i></span><span class="betValue">${me.currentBet}</span></div></div>`:'';
 let controls='';
 if(canStart){
   controls=`<div class="controlTop"><div><div class="controlPrompt">次のハンド</div><div class="controlInfo">SB ${state.smallBlind} / BB ${state.bigBlind}</div></div></div><button class="betConfirm" data-act="start_hand">DEAL</button>`;
 }else if(drawing){
   controls=`<div class="controlTop"><div><div class="controlPrompt">交換するカードを選択</div><div class="controlInfo">0〜5枚 / 選択中 ${selected.size}枚</div></div></div><button class="betConfirm" id="drawBtn">${selected.size===0?'STAND PAT':selected.size+'枚交換'}</button>`;
 }else if(myTurn){
   const canRaise=!!ai.canRaise,shortOnly=!!ai.shortAllInOnly,base=canRaise?(shortOnly?max:Math.min(max,min)):0,step=Math.max(1,state.bigBlind||20);
   const half=niceTarget((me?.currentBet||0)+call+Math.ceil((state.pot+call)*.5),min,max);
   const three=niceTarget((me?.currentBet||0)+call+Math.ceil((state.pot+call)*.75),min,max);
   const potTarget=niceTarget((me?.currentBet||0)+call+(state.pot+call),min,max);
   const primary=ai.canCheck?'<button class="checkAct" data-act="check">CHECK</button>':ai.canCall?`<button class="callAct" data-act="call">CALL ${Math.min(call,me.chips)}</button>`:'<button class="checkAct" disabled>—</button>';
   const raiseLabel=state.currentBet===0?'BET':'RAISE';
   controls=`<div class="controlTop"><div><div class="controlPrompt">YOUR ACTION</div><div class="controlInfo">Pot ${state.pot} · Call ${call} · Stack ${me.chips}</div></div><div class="controlInfo">${phaseName()}</div></div><div class="casinoActions"><button class="foldAct" data-act="fold">FOLD</button>${primary}<button class="callAct" id="openRaise" ${canRaise?'':'disabled'}>${raiseLabel}</button></div>${canRaise?`<div class="betControls"><div class="betSizing"><div class="betAmountRow"><div><div class="betAmountHint">${raiseLabel} TO</div><div class="betAmountBig"><span id="raiseValue">${base}</span></div></div><div class="betAmountHint">${shortOnly?'ALL-IN ONLY':`MIN ${min} · MAX ${max}`}</div></div><div class="betPreset">${shortOnly?'':`<button data-raise="${min}">MIN</button><button data-raise="${half}">½ POT</button><button data-raise="${three}">¾ POT</button>`}<button data-raise="${max}">ALL IN</button></div><div class="betSliderRow"><button id="minusBB" ${shortOnly?'disabled':''}>−</button><input id="raiseRange" type="range" min="${shortOnly?max:min}" max="${max}" value="${base}" step="1" ${shortOnly?'disabled':''}><button id="plusBB" ${shortOnly?'disabled':''}>+</button></div><input id="raise" type="number" value="${base}" hidden></div><button class="betConfirm ${base===max?'allinConfirm':''}" id="raiseBtn">${base===max?'ALL IN '+base:raiseLabel+' '+base}</button></div>`:''}`;
 }else{
   const who=state.players.find(p=>p.seat===state.currentTurnSeat);
   controls=`<div class="spectateLine">${state.phase==='lobby'?'Waiting for deal…':state.phase==='showdown'?'Hand complete':state.phase==='draw_select'?'Waiting for draw…':who?`Waiting for ${esc(who.name)}…`:'Dealing…'}</div>`;
 }
 const online=state.playMode==='online';
 app.innerHTML=`<main class="shell"><header class="gameHeader"><div class="gameTitle"><h2>${state.gameType==='texas'?'NL TEXAS HOLD’EM':'FIVE CARD DRAW'}</h2><span class="roundPill">${state.smallBlind}/${state.bigBlind}</span>${online?`<button id="copy" class="roomCode">${esc(state.code)}</button>`:''}</div><div class="stats"><span class="pill">HAND ${state.handNo}</span></div></header><div id="err" class="error" style="display:none;max-width:1100px;margin:8px auto"></div><div class="realTableWrap"><section class="pokerStage realTable">${potChanged?'<span class="chipfly"></span>':''}<div class="dealerTray">DEALER</div><div class="deckStack"></div><div class="feltMark">${isDraw?'FIVE CARD DRAW':'NO LIMIT TEXAS HOLD’EM'}</div>${seatsHtml}${betsHtml}<div class="boardCenter"><div class="potReal">POT <strong>${state.pot}</strong></div><div class="boardCards">${board}</div><div class="streetLabel">${phaseName()}</div></div>${heroBet}<div class="heroSeat"><div class="heroSeatBox"><div class="heroMeta"><span class="heroName">${esc(me?.name||'YOU')}</span>${me?.allIn?'<span class="positionTag tagAll">ALL IN</span>':heroRole}<span class="heroStack">${me?.chips||0} chips</span></div><div class="heroHoleCards yourCards ${me?.folded?'foldedHand':''}">${heroCards}</div>${me?.folded?'<div class="foldedLabel">MUCKED</div>':''}</div></div>${state.lastResult?`<div class="showdownLine">${esc(state.lastResult.text)}</div>`:''}</section></div><section class="casinoControls">${controls}</section><p class="fine"><a class="home" href="${location.pathname}">ロビーへ</a> · Play-money only</p></main>`;
 if(online)document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(location.origin+location.pathname+'?room='+state.code).then(()=>toast('招待リンクをコピーしました'));
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act({type:b.dataset.act}));
 document.querySelectorAll('[data-card-index]').forEach(c=>c.onclick=()=>{const i=Number(c.dataset.cardIndex);if(selected.has(i))selected.delete(i);else if(selected.size<5)selected.add(i);render()});
 const db=document.getElementById('drawBtn');if(db)db.onclick=()=>act({type:'draw',discardIndexes:[...selected]});
 document.querySelectorAll('[data-raise]').forEach(b=>b.onclick=()=>setRaiseTarget(Number(b.dataset.raise)));
 const slider=document.getElementById('raiseRange');if(slider)slider.oninput=()=>setRaiseTarget(slider.value);
 const minus=document.getElementById('minusBB');if(minus)minus.onclick=()=>setRaiseTarget(Number(document.getElementById('raise').value)-Math.max(1,state.bigBlind||20));
 const plus=document.getElementById('plusBB');if(plus)plus.onclick=()=>setRaiseTarget(Number(document.getElementById('raise').value)+Math.max(1,state.bigBlind||20));
 const rb=document.getElementById('raiseBtn');if(rb)rb.onclick=()=>{const v=Number(document.getElementById('raise').value);const legalMin=ai.shortAllInOnly?max:min;if(v<legalMin||v>max)return err(`レイズ額は ${legalMin} ～ ${max}`);act({type:'raise',amount:v})};
 const or=document.getElementById('openRaise');if(or)or.onclick=()=>document.querySelector('.betControls')?.scrollIntoView({behavior:'smooth',block:'nearest'});
 window.__prevPlayers=state.players.map(p=>({id:p.id,handBet:p.handBet}));
 prevView={handNo:state.handNo,phase:state.phase,pot:state.pot,community:state.communityCards.length,turn:state.currentTurnSeat,result:state.lastResult?.text||''};showActionBanner(newestAction);
}
async function load(){const t=localStorage.getItem(tokenKey(room));if(!t){home();return}try{const next=await req('/api/room/'+room,{headers:{'x-player-token':t},cache:'no-store'});const sig=JSON.stringify(next);if(sig===lastStateSig)return;state=next;lastStateSig=sig;render();err('')}catch(e){if(e.message==='Not joined'){localStorage.removeItem(tokenKey(room));home()}else err(e.message)}}
async function act(a){if(busy)return;busy=true;try{if(a.type==='fold')await animateFoldPress();const t=localStorage.getItem(tokenKey(room));const next=await req('/api/room/'+room+'/action',{method:'POST',headers:{'content-type':'application/json','x-player-token':t},body:JSON.stringify(a)});state=next;lastStateSig=JSON.stringify(next);selected.clear();render();if(a.type==='fold'&&state.phase==='showdown'&&state.lastResult?.winners?.length){await sleep(220);const w=state.lastResult.winners[0];animatePotToWinner(w.playerId,w.amount);await sleep(1250)}}catch(e){err(e.message);await load()}finally{busy=false}}
if(room&&localStorage.getItem(tokenKey(room))){app.innerHTML='<div class="loading">接続中...</div>';load();timer=setInterval(()=>{if(!busy&&!document.hidden)load()},1500)}else home();
</script></body></html>
